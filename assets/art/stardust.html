<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ASCII 3D Starburst</title>
<style>
  body { margin:0; background:black; font-family:monospace; color:white; }
  canvas { display:block; margin:auto; image-rendering:pixelated; background:black; }
</style>
</head>
<body>
<canvas id="canvas" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently:true });
const W = canvas.width = 600, H = canvas.height = 600;
ctx.font = "9px monospace"; ctx.textBaseline="top";

const charSets = {
  default: ['@','#','%','*','+','=','-','.',':',' '],
  blocks: ['█','▓','▒','░','▪','▫','■','□','▬',' '],
  symbols: ['●','◆','◉','◎','○','◇','◊','⊙','⊕',' '],
  binary: ['1','1','1','0','0','0','|',':','.',' '],
  hearts: ['♥','♡','❤','❥','♥','♡','❤','❥','•',' '],
  stars: ['★','☆','✦','✧','✪','✫','✬','✭','*',' ']
};
let currentChars = charSets.default;
const loopFrames = 240;
let t = 0;

let shapeType = "starburst", radius = 120, height = 200, pointsCount = 5000;
let scale = 14, tilt = 0.6, rotationSpeed = 0.01;
let palette = ['#4CC9F0','#4361EE','#3A0CA3','#7209B7'];
let depthSizing = false, shaderEffects = false, temporalEcho = false;
let echoFrames = [];
let basePoints = [];

function initPoints(){
  basePoints = [];
  for(let i=0;i<pointsCount;i++){
    const angle = Math.random()*Math.PI*2;
    const y = (Math.random()-0.5)*height;
    basePoints.push({angle,y});
  }
}

function project3D(x,y,z,angleY){
  let y2 = y*Math.cos(tilt) - z*Math.sin(tilt);
  let z2 = y*Math.sin(tilt) + z*Math.cos(tilt);
  const x2 = x*Math.cos(angleY) - z2*Math.sin(angleY);
  z2 = x*Math.sin(angleY) + z2*Math.cos(angleY);
  return {x:W/2+x2*scale, y:H/2+y2*scale, z:z2};
}

function getHue(hex){
  const r=parseInt(hex.substr(1,2),16)/255;
  const g=parseInt(hex.substr(3,2),16)/255;
  const b=parseInt(hex.substr(5,2),16)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h=0;
  if(max===min) h=0;
  else if(max===r) h=(60*((g-b)/(max-min))+360)%360;
  else if(max===g) h=(60*((b-r)/(max-min))+120)%360;
  else h=(60*((r-g)/(max-min))+240)%360;
  return h;
}

function drawFrame(frame){
  ctx.clearRect(0,0,W,H);
  const phase = (frame/loopFrames)*2*Math.PI;
  if(temporalEcho && echoFrames.length>0){
    for(let e=echoFrames.length-1;e>=0;e--){
      ctx.globalAlpha = 0.3*(e/echoFrames.length);
      ctx.putImageData(echoFrames[e],0,0);
    }
    ctx.globalAlpha=1;
  }
  let framePoints=[];
  for(let i=0;i<basePoints.length;i++){
    const bp=basePoints[i];
    let r, angle, x, y, z;
    const theta=Math.random()*2*Math.PI;
    const phi=Math.acos(2*(Math.random()-0.5));
    const pulse=1+0.5*Math.sin(phase*3);
    const burst=radius*(0.4+0.6*Math.abs(Math.sin(phase*2+i*0.01)));
    r=burst*pulse;
    x=r*Math.sin(phi)*Math.cos(theta);
    y=r*Math.sin(phi)*Math.sin(theta);
    z=r*Math.cos(phi)*Math.sin(phase+i*0.005);
    framePoints.push({x,y,z,i});
  }

  framePoints.sort((a,b)=>{
    const pa=project3D(a.x,a.y,a.z,rotationSpeed*frame);
    const pb=project3D(b.x,b.y,b.z,rotationSpeed*frame);
    return pa.z-pb.z;
  });

  for(let point of framePoints){
    const {x,y,z,i}=point;
    const proj=project3D(x,y,z,rotationSpeed*frame);
    let light=40+30*(1-(proj.z/20+0.5));
    let hue=getHue(palette[i%palette.length]);
    if(shaderEffects){ hue=(hue+frame*2+proj.z*0.5)%360; light+=10*Math.sin(frame*0.1+i*0.01);}
    ctx.fillStyle=`hsl(${hue},100%,${Math.max(0,Math.min(100,light))}%)`;
    let fontSize=9;
    if(depthSizing){ fontSize=Math.max(6,Math.min(18,9*(1+proj.z/200))); ctx.font=`${fontSize}px monospace`; }
    const char=currentChars[i%currentChars.length];
    ctx.fillText(char,Math.floor(proj.x/9)*9,Math.floor(proj.y/9)*9);
  }

  if(temporalEcho){ echoFrames.push(ctx.getImageData(0,0,W,H)); if(echoFrames.length>5) echoFrames.shift(); } else { echoFrames=[]; }
  ctx.font="9px monospace";
}

function loop(){ drawFrame(t); t=(t+1)%loopFrames; requestAnimationFrame(loop); }

initPoints();
loop();
</script>
</body>
</html>
